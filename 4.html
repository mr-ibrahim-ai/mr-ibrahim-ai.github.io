<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام الإدارة</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f4f6f8;color:#17202a;font-family:Arial,Tahoma,sans-serif;font-size:12px}
.control{position:sticky;top:0;z-index:20;background:#fff;padding:10px;border-bottom:1px solid #ddd;display:flex;gap:7px}
select,button{height:34px;border:1px solid #d5d9df;border-radius:6px;padding:0 10px;font-family:inherit;font-size:12px}
select{flex:1;background:#fff}
button{background:#17202a;color:#fff;border:0;min-width:70px;cursor:pointer}
button:active{transform:scale(.97)}
.header{background:#fff;padding:9px 13px;border-bottom:1px solid #e5e7eb}
.title{font-size:16px;font-weight:700}
.status{font-size:11px;color:#667085;margin-top:4px}
.container{width:100%;overflow:auto;padding:8px}
table{border-collapse:collapse;width:max-content;background:#fff}
th,td{border:1px solid #dfe3e8;padding:5px 7px;text-align:right;white-space:nowrap;font-size:11px;line-height:1.3}
th{background:#eef1f4;font-weight:700;position:sticky;top:0;z-index:5}
tr:nth-child(even) td{background:#fafafa}
.cell{display:flex;align-items:center;gap:5px}
.cellMain{white-space:nowrap}
.cellPart{font-size:10px;color:#667085;border-right:1px solid #d5d9df;padding-right:5px;direction:ltr}
.loading{text-align:center;padding:12px;color:#667085;font-size:11px}
</style>
</head>
<body>
<div class="control">
<select id="page">
<option value="الطلاب">الطلاب</option>
<option value="المعلمين">المعلمين</option>
<option value="النتائج">النتائج</option>
<option value="الفواتير">الفواتير</option>
<option value="الأختبارات">الأختبارات</option>
<option value="تصحيح الأختبار">تصحيح الأختبار</option>
</select>
<button id="send">إرسال</button>
</div>
<div class="header">
<div class="title" id="title">اختر الصفحة</div>
<div class="status" id="status">اختر الصفحة ثم اضغط إرسال</div>
</div>
<div class="container">
<table>
<thead id="head"></thead>
<tbody id="body"></tbody>
</table>
<div class="loading" id="loading"></div>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycby1jwW6vtb3dzYMP_bxGxrzOkiE1mFeAN9WIvq0lrr56tnxLet0sGFiCtqynhvoVLHa8g/exec';
let current='',next=2,count=0,finished=false,version=0,activeScript=null;
document.getElementById('send').onclick=()=>{
version++;
if(activeScript){activeScript.remove();activeScript=null}
current=document.getElementById('page').value;
next=2;
count=0;
finished=false;
document.getElementById('title').textContent=current;
document.getElementById('status').textContent='جاري الاتصال...';
document.getElementById('loading').textContent='جاري تحميل البيانات...';
document.getElementById('head').innerHTML='';
document.getElementById('body').innerHTML='';
load(version);
};
function load(myVersion){
if(myVersion!==version||finished)return;
const callback='cb_'+Date.now()+'_'+Math.floor(Math.random()*100000);
let done=false;
window[callback]=data=>{
if(done||myVersion!==version){cleanup();return}
done=true;
try{
if(data.error)throw new Error(data.error);
if(next===2)document.getElementById('head').innerHTML='<tr>'+data.headers.map(v=>'<th>'+formatCell(v)+'</th>').join('')+'</tr>';
let html='';
data.data.forEach(row=>{
html+='<tr>'+row.map(v=>'<td>'+formatCell(v)+'</td>').join('')+'</tr>';
count++;
});
document.getElementById('body').insertAdjacentHTML('beforeend',html);
next=data.next;
document.getElementById('status').textContent='تم عرض '+count+' صف';
if(next===null){
finished=true;
document.getElementById('loading').textContent='تم تحميل جميع البيانات';
}else{
document.getElementById('loading').textContent='جاري تحميل المزيد...';
setTimeout(()=>load(myVersion),20);
}
}catch(e){
if(myVersion===version){
finished=true;
document.getElementById('status').textContent='حدث خطأ';
document.getElementById('loading').textContent=e.message;
}
}
cleanup();
};
const script=document.createElement('script');
activeScript=script;
script.src=API+'?sheet='+encodeURIComponent(current)+'&start='+next+'&callback='+callback;
script.onerror=()=>{
if(done||myVersion!==version){cleanup();return}
done=true;
if(myVersion===version){
document.getElementById('status').textContent='فشل الاتصال';
document.getElementById('loading').textContent='تعذر الاتصال بالبيانات';
}
cleanup();
};
document.body.appendChild(script);
function cleanup(){
delete window[callback];
if(activeScript){activeScript.remove();activeScript=null}
}
}
function formatCell(value){
let v=String(value??'').trim(),parts=[],last=0,re=/\(([^()]*)\)/g,m;
while((m=re.exec(v))){
const before=v.slice(last,m.index).trim();
if(before)parts.push('<span class="cellMain">'+esc(before)+'</span>');
if(m[1].trim())parts.push('<span class="cellPart">'+esc(m[1].trim())+'</span>');
last=re.lastIndex;
}
const after=v.slice(last).trim();
if(after)parts.push('<span class="cellMain">'+esc(after)+'</span>');
return parts.length?'<div class="cell">'+parts.join('')+'</div>':'';
}
function esc(v){
return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
</script>
</body>
</html>
