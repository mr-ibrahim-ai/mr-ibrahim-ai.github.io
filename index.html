<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#0b1220">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="أكاديمية البيان">

    <meta name="description"
          content="منصة أكاديمية البيان التعليمية">

    <link rel="manifest" href="manifest.json">

    <link rel="icon"
          type="image/png"
          sizes="192x192"
          href="file_000000004b1c822f832d57514330ad17.png">

    <link rel="apple-touch-icon"
          href="file_000000004b1c822f832d57514330ad17.png">

    <title>أكاديمية البيان</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, Tahoma, sans-serif;
            background: #0b1220;
            color: white;
        }

        body {
            min-height: 100vh;
        }

        #app {
            width: 100%;
            min-height: 100vh;
        }

        button {
            font-family: inherit;
        }

        .welcome {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: #111a2b;
            border: 1px solid #26344d;
            border-radius: 24px;
            padding: 30px 22px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,.3);
        }

        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border-radius: 22px;
            margin-bottom: 18px;
        }

        .title {
            margin: 0 0 10px;
            font-size: 28px;
            font-weight: bold;
        }

        .description {
            margin: 0 0 25px;
            color: #b8c2d3;
            line-height: 1.8;
            font-size: 15px;
        }

        .install-btn {
            width: 100%;
            border: 0;
            border-radius: 14px;
            padding: 15px 18px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .install-btn:active {
            transform: scale(.98);
        }

        .install-info {
            display: none;
            margin-top: 18px;
            padding: 16px;
            border-radius: 14px;
            background: #182338;
            color: #d5dbea;
            line-height: 1.9;
            font-size: 14px;
        }

        .share-icon {
            display: inline-block;
            font-size: 22px;
            margin: 0 3px;
        }

        .already-installed {
            display: none;
            color: #86efac;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div id="app">
    <div class="welcome">
        <div class="card">
            <img class="logo"
                 src="file_000000004b1c822f832d57514330ad17.png"
                 alt="أكاديمية البيان">

            <h1 class="title">أكاديمية البيان</h1>

            <p class="description">
                مرحبًا بك في منصة أكاديمية البيان التعليمية
            </p>

            <button id="installButton" class="install-btn">
                📲 تثبيت التطبيق
            </button>

            <div id="installInfo" class="install-info"></div>

            <div id="alreadyInstalled" class="already-installed">
                ✓ التطبيق مثبت بالفعل على جهازك
            </div>
        </div>
    </div>
</div>

<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
            navigator.serviceWorker
                .register("service-worker.js")
                .then(function (registration) {
                    console.log("Service Worker registered:", registration.scope);
                })
                .catch(function (error) {
                    console.error("Service Worker registration failed:", error);
                });
        });
    }

    let deferredPrompt = null;
    const installButton = document.getElementById("installButton");
    const installInfo = document.getElementById("installInfo");
    const alreadyInstalled = document.getElementById("alreadyInstalled");

    function isStandalone() {
        return window.matchMedia("(display-mode: standalone)").matches ||
               window.navigator.standalone === true;
    }

    function isIOS() {
        return /iphone|ipad|ipod/i.test(navigator.userAgent);
    }

    function showInstalled() {
        installButton.style.display = "none";
        installInfo.style.display = "none";
        alreadyInstalled.style.display = "block";
    }

    function showInstallButton() {
        installButton.style.display = "block";
        alreadyInstalled.style.display = "none";
    }

    if (isStandalone()) {
        showInstalled();
    } else {
        showInstallButton();
    }

    window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        deferredPrompt = event;
        showInstallButton();
    });

    installButton.addEventListener("click", async function () {
        if (isStandalone()) {
            showInstalled();
            return;
        }

        if (deferredPrompt) {
            deferredPrompt.prompt();

            try {
                const result = await deferredPrompt.userChoice;

                if (result.outcome === "accepted") {
                    installButton.style.display = "none";
                }
            } catch (error) {
                console.error(error);
            }

            deferredPrompt = null;
            return;
        }

        if (isIOS()) {
            installInfo.style.display = "block";
            installInfo.innerHTML =
                "لتثبيت أكاديمية البيان على جهازك:<br>" +
                "اضغط على زر المشاركة <span class=\"share-icon\">↗️</span> " +
                "في Safari ثم اختر <strong>إضافة إلى الشاشة الرئيسية</strong>.";
            return;
        }

        installInfo.style.display = "block";
        installInfo.innerHTML =
            "التثبيت المباشر غير متاح حاليًا في هذا المتصفح.<br>" +
            "افتح قائمة المتصفح وابحث عن <strong>تثبيت التطبيق</strong> أو " +
            "<strong>إضافة إلى الشاشة الرئيسية</strong>.";
    });

    window.addEventListener("appinstalled", function () {
        deferredPrompt = null;
        showInstalled();
    });
</script>

</body>
</html>
